name: Build VlessManager for OpenWrt

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PKG_NAME: luci-app-vlessmanager

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: openwrt-24.10.0
            sdk_page: https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/
            cache_key: sdk-24.10.0-v8
          - name: openwrt-snapshot
            sdk_page: https://downloads.openwrt.org/snapshots/targets/x86/64/
            cache_key: sdk-snapshot-v8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository layout
        run: |
          set -eux
          test -d luci-app-vlessmanager
          test -f luci-app-vlessmanager/Makefile
          test -f luci-app-vlessmanager/root/etc/config/vlessmanager
          test -f luci-app-vlessmanager/root/etc/init.d/vlessmanager
          test -f luci-app-vlessmanager/root/usr/bin/vlessmanager
          test -f luci-app-vlessmanager/root/usr/bin/vlessmanager-urltest
          test -f luci-app-vlessmanager/htdocs/luci-static/resources/view/vlessmanager/settings.js

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl tar zstd

      - name: Cache SDK
        uses: actions/cache@v4
        id: cache-sdk
        with:
          path: sdk
          key: ${{ matrix.cache_key }}

      - name: Download OpenWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -eux
          SDK_PAGE="${{ matrix.sdk_page }}"
          HTML="$(curl -fsSL "$SDK_PAGE")"
          SDK_FILE="$(printf '%s' "$HTML" | grep -Eo 'openwrt-sdk-[^"]+\.(tar\.zst|tar\.xz|tar\.gz)' | head -n1)"
          test -n "$SDK_FILE"
          wget -q "${SDK_PAGE}${SDK_FILE}" -O sdk-archive

          mkdir -p sdk
          case "$SDK_FILE" in
            *.tar.zst) zstd -d sdk-archive --stdout | tar -x -C sdk --strip-components=1 ;;
            *.tar.xz)  tar -xJf sdk-archive -C sdk --strip-components=1 ;;
            *.tar.gz)  tar -xzf sdk-archive -C sdk --strip-components=1 ;;
            *) echo "Unsupported SDK archive: $SDK_FILE"; exit 1 ;;
          esac

          rm -f sdk-archive

      - name: Prepare package inside SDK
        run: |
          set -eux
          rm -rf sdk/package/${PKG_NAME}
          mkdir -p sdk/package/${PKG_NAME}
          cp -a luci-app-vlessmanager/. sdk/package/${PKG_NAME}/
          test -f sdk/package/${PKG_NAME}/Makefile

      - name: Configure build
        run: |
          set -eux
          cd sdk
          rm -f .config
          touch .config
          echo "CONFIG_ALL_NONSHARED=y" >> .config
          echo "CONFIG_PACKAGE_${PKG_NAME}=m" >> .config
          make defconfig
          test -f package/${PKG_NAME}/Makefile

      - name: Build package
        run: |
          set -eux
          cd sdk
          make package/${PKG_NAME}/compile V=s -j"$(nproc)" || \
          make package/${PKG_NAME}/compile V=s -j1

      - name: Collect artifacts
        run: |
          set -eux
          mkdir -p artifacts
          find sdk/bin/ -type f \( -name "${PKG_NAME}*.apk" -o -name "${PKG_NAME}*.ipk" \) \
            -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-${{ matrix.name }}
          path: artifacts/
          retention-days: 90
  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.PKG_NAME }}-*
          path: release/
          merge-multiple: true

      - name: Show release files
        run: |
          echo "=== Release files ==="
          find release/ -type f | sort
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

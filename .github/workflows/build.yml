# .github/workflows/build.yml

name: Build VlessManager for OpenWrt

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt version'
        required: true
        default: '25.0.0'
        type: choice
        options:
          - '25.0.0'
          - 'snapshot'
      targets:
        description: 'Build targets (comma-separated)'
        required: true
        default: 'x86-64,aarch64_cortex-a53,aarch64_cortex-a72,arm_cortex-a7_neon-vfpv4,mipsel_24kc'
        type: string

env:
  PKG_NAME: luci-app-vlessmanager
  PKG_VERSION: '1.0.0'

jobs:
  # ============================================================
  # Job 1: Сборка arch-independent пакета (LuCI JS + скрипты)
  # ============================================================
  build-package:
    name: Build Package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - openwrt_version: '25.0.0'
            sdk_url_base: 'https://downloads.openwrt.org/releases/25.0.0/targets'
            target: 'x86/64'
            arch: 'x86_64'
          - openwrt_version: '25.0.0'
            sdk_url_base: 'https://downloads.openwrt.org/releases/25.0.0/targets'
            target: 'mediatek/filogic'
            arch: 'aarch64_cortex-a53'
          - openwrt_version: '25.0.0'
            sdk_url_base: 'https://downloads.openwrt.org/releases/25.0.0/targets'
            target: 'rockchip/armv8'
            arch: 'aarch64_generic'
          - openwrt_version: 'SNAPSHOT'
            sdk_url_base: 'https://downloads.openwrt.org/snapshots/targets'
            target: 'x86/64'
            arch: 'x86_64'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl jq

      - name: Cache OpenWrt SDK
        uses: actions/cache@v4
        id: cache-sdk
        with:
          path: sdk
          key: sdk-${{ matrix.openwrt_version }}-${{ matrix.arch }}-v2

      - name: Download OpenWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -ex

          TARGET="${{ matrix.target }}"
          SDK_BASE="${{ matrix.sdk_url_base }}"

          # Находим SDK
          SDK_PAGE="${SDK_BASE}/${TARGET}/"
          echo "Looking for SDK at: ${SDK_PAGE}"

          # Скачиваем список файлов и ищем SDK
          SDK_FILE=$(curl -fsSL "${SDK_PAGE}" | \
            grep -oP 'openwrt-sdk[^"]*\.tar\.[xz|zst|gz]+' | \
            head -1) || true

          if [ -z "$SDK_FILE" ]; then
            # Альтернативный поиск
            SDK_FILE=$(curl -fsSL "${SDK_PAGE}" | \
              grep -oP 'href="([^"]*sdk[^"]*)"' | \
              sed 's/href="//;s/"//' | head -1) || true
          fi

          if [ -z "$SDK_FILE" ]; then
            echo "ERROR: Cannot find SDK for target ${TARGET}"
            echo "Page content:"
            curl -fsSL "${SDK_PAGE}" | head -50
            exit 1
          fi

          echo "Downloading SDK: ${SDK_FILE}"
          wget -q "${SDK_BASE}/${TARGET}/${SDK_FILE}" -O sdk.tar.xz

          mkdir -p sdk
          tar xf sdk.tar.xz --strip-components=1 -C sdk
          rm sdk.tar.xz

      - name: Prepare package source
        run: |
          set -ex

          # Копируем пакет в SDK
          mkdir -p sdk/package/${PKG_NAME}
          cp -r luci-app-vlessmanager/* sdk/package/${PKG_NAME}/

          # Обновляем feeds
          cd sdk
          echo "src-git luci https://github.com/openwrt/luci.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build package
        run: |
          set 

name: Build VlessManager for OpenWrt

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PKG_NAME: luci-app-vlessmanager

jobs:
  build:
    name: Build package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - openwrt_version: "24.10.0"
            base_url: "https://downloads.openwrt.org/releases/24.10.0"
          - openwrt_version: "25.05.0"
            base_url: "https://downloads.openwrt.org/releases/25.05.0"
          - openwrt_version: "snapshot"
            base_url: "https://downloads.openwrt.org/snapshots"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl jq tar zstd

      - name: Cache SDK
        uses: actions/cache@v4
        id: cache-sdk
        with:
          path: sdk
          key: sdk-${{ matrix.openwrt_version }}-x86_64-v1

      - name: Download OpenWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -eux

          TARGET="x86/64"
          SDK_PAGE="${{ matrix.base_url }}/targets/${TARGET}/"

          echo "Using SDK page: $SDK_PAGE"

          curl -fI "$SDK_PAGE"

          SDK_FILE="$(curl -fsSL "$SDK_PAGE" | grep -Eo 'openwrt-sdk-[^"]+\.(tar\.zst|tar\.xz|tar\.gz)' | head -n1)"
          test -n "$SDK_FILE"

          echo "SDK file: $SDK_FILE"

          wget -q "${SDK_PAGE}${SDK_FILE}" -O sdk.tar

          mkdir -p sdk
          case "$SDK_FILE" in
            *.tar.zst) tar --zstd -xf sdk.tar -C sdk --strip-components=1 ;;
            *.tar.xz)  tar -xJf sdk.tar -C sdk --strip-components=1 ;;
            *.tar.gz)  tar -xzf sdk.tar -C sdk --strip-components=1 ;;
            *) echo "Unsupported SDK archive: $SDK_FILE"; exit 1 ;;
          esac

          rm -f sdk.tar

      - name: Prepare package
        run: |
          set -eux
          mkdir -p sdk/package/${PKG_NAME}
          cp -r luci-app-vlessmanager/* sdk/package/${PKG_NAME}/

      - name: Update feeds
        run: |
          set -eux
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build package
        run: |
          set -eux
          cd sdk
          make defconfig
          make package/${PKG_NAME}/compile V=s -j"$(nproc)" || \
          make package/${PKG_NAME}/compile V=s -j1

      - name: Collect artifacts
        run: |
          set -eux
          mkdir -p artifacts
          find sdk/bin/ -type f \( -name "${PKG_NAME}*.apk" -o -name "${PKG_NAME}*.ipk" \) -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-${{ matrix.openwrt_version }}
          path: artifacts/
          retention-days: 90

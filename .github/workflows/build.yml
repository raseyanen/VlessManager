name: Build VlessManager for OpenWrt

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PKG_NAME: luci-app-vlessmanager

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: openwrt-24.10.0
            sdk_page: https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/
            cache_key: sdk-24.10.0-v6
          - name: openwrt-snapshot
            sdk_page: https://downloads.openwrt.org/snapshots/targets/x86/64/
            cache_key: sdk-snapshot-v6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl tar zstd

      - name: Cache SDK
        uses: actions/cache@v4
        id: cache-sdk
        with:
          path: sdk
          key: ${{ matrix.cache_key }}

      - name: Download OpenWrt SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -eux

          SDK_PAGE="${{ matrix.sdk_page }}"
          HTML="$(curl -fsSL "$SDK_PAGE")"

          SDK_FILE="$(printf '%s' "$HTML" | grep -Eo 'openwrt-sdk-[^"]+\.(tar\.zst|tar\.xz|tar\.gz)' | head -n1)"
          test -n "$SDK_FILE"

          echo "Found SDK: $SDK_FILE"
          wget -q "${SDK_PAGE}${SDK_FILE}" -O sdk-archive

          mkdir -p sdk
          case "$SDK_FILE" in
            *.tar.zst) zstd -d sdk-archive --stdout | tar -x -C sdk --strip-components=1 ;;
            *.tar.xz)  tar -xJf sdk-archive -C sdk --strip-components=1 ;;
            *.tar.gz)  tar -xzf sdk-archive -C sdk --strip-components=1 ;;
            *) echo "Unsupported SDK archive: $SDK_FILE"; exit 1 ;;
          esac

          rm -f sdk-archive

      - name: Prepare package inside SDK
        run: |
          set -eux

          rm -rf sdk/package/${PKG_NAME}
          mkdir -p sdk/package/${PKG_NAME}
          rsync -a --delete luci-app-vlessmanager/ sdk/package/${PKG_NAME}/

          echo "=== Package files ==="
          find sdk/package/${PKG_NAME} -maxdepth 3 -type f | sort

      - name: Update feeds
        run: |
          set -eux
          cd sdk

          ./scripts/feeds update packages
          ./scripts/feeds update luci

      - name: Install required dependencies metadata
        run: |
          set -eux
          cd sdk

          ./scripts/feeds install -p packages curl sing-box || true
          ./scripts/feeds install -p luci luci-base || true

      - name: Configure build
        run: |
          set -eux
          cd sdk

          rm -f .config
          touch .config
          echo "CONFIG_ALL_NONSHARED=y" >> .config
          echo "CONFIG_PACKAGE_${PKG_NAME}=m" >> .config

          make defconfig

          echo "=== Check package visibility ==="
          test -f package/${PKG_NAME}/Makefile
          grep "CONFIG_PACKAGE_${PKG_NAME}" .config || true

      - name: Build package
        run: |
          set -eux
          cd sdk

          make package/${PKG_NAME}/compile V=s -j"$(nproc)" || \
          make package/${PKG_NAME}/compile V=s -j1 V=s

      - name: Collect artifacts
        run: |
          set -eux
          mkdir -p artifacts

          find sdk/bin/ -type f \( -name "${PKG_NAME}*.apk" -o -name "${PKG_NAME}*.ipk" \) \
            -exec cp {} artifacts/ \;

          echo "=== Artifacts ==="
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-${{ matrix.name }}
          path: artifacts/
          retention-days: 90
